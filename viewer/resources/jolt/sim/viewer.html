<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jolt-sim viewer</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; }
    header, main { padding: 1rem 1.25rem; }
    header { border-bottom: 1px solid #8886; }
    h1 { margin: 0; font-size: 1.35rem; }
    .controls { display: grid; gap: .8rem; grid-template-columns: minmax(15rem, 1fr) auto auto; align-items: end; }
    label { display: grid; gap: .3rem; font-size: .9rem; }
    input, button { font: inherit; padding: .45rem .6rem; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #status { min-height: 1.5rem; margin: .8rem 0; white-space: pre-wrap; }
    iframe { width: 100%; height: 65vh; border: 1px solid #8886; background: white; }
    pre { max-height: 22rem; overflow: auto; padding: .8rem; border: 1px solid #8886; white-space: pre-wrap; }
    .muted { opacity: .75; }
    @media (max-width: 700px) { .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>jolt-sim retained-case viewer</h1>
    <p class="muted">The document stays in this browser until you explicitly inspect or replay it.</p>
  </header>
  <main>
    <div class="controls">
      <label>Case/Outcome EDN
        <input id="case-file" type="file" accept=".edn,application/edn,text/plain">
      </label>
      <label>Session capability
        <input id="capability" type="password" autocomplete="off" spellcheck="false">
      </label>
      <div>
        <button id="inspect" type="button" disabled>Inspect</button>
        <button id="replay" type="button" disabled>Replay once</button>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <iframe id="report" sandbox title="Validated retained-case report"></iframe>
    <h2>Fresh replay outcome</h2>
    <pre id="outcome">No replay has run.</pre>
  </main>
  <script src="/viewer.js"></script>
</body>
</html>
