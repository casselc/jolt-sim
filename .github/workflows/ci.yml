name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Broadcast retries must be able to publish while Maelstrom leaves stdin idle.
  # This pin includes the reviewed cooperative-stdin runtime fix and persistent
  # evaluator namespace semantics; do not replace either with jolt-sim-side
  # transport or source-text workarounds.
  JOLT_CORE_SHA: 615e52517042d62d0f92fb55f78a24e89bfe7af8
  CHEZ_RELEASE_TAG: chez-ci-10.4.1.1
  MAELSTROM_RELEASE: v0.2.4
  MAELSTROM_ARCHIVE_SHA256: 301ec71d6b12af0d765edb413f5cf5aa1046b5609bd4e31376a0b549548e5799

jobs:
  sim-posix:
    name: sim image (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # The Linux x86_64 lane runs two independently bounded Hegel campaigns
    # after the ordinary gates and still reserves time for report rendering
    # and unconditional raw-artifact upload. Other platforms retain the
    # existing one-hour ceiling.
    timeout-minutes: ${{ matrix.job-timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            toolchain: linux-x86_64
            machine: ta6le
            chez-sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
            hegel: true
            job-timeout: 120
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            toolchain: linux-aarch64
            machine: tarm64le
            chez-sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
            hegel: false
            job-timeout: 60
          - name: macOS x86_64
            runner: macos-15-intel
            toolchain: macos-x86_64
            machine: ta6osx
            chez-sha256: e4577ad71b1f1e1062c361fa612af60d75378e64dc2869d8c8eefd3d7efdbc62
            hegel: false
            job-timeout: 60
          - name: macOS arm64
            runner: macos-15
            toolchain: macos-arm64
            machine: tarm64osx
            chez-sha256: d5b5a504eed1e0f117b4a3dd23ad0030bb3e5c0da6d6b9d9f990f5f2fa32478f
            hegel: false
            job-timeout: 60
    steps:
      - name: Checkout jolt-sim
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: jolt-sim

      - name: Checkout pinned Jolt simulation core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt-core

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdb liblz4-dev zlib1g-dev libncurses-dev libsqlite3-dev uuid-dev zstd

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 zstd

      - name: Install verified Chez 10.4.1 toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: ${{ matrix.toolchain }}
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: ${{ matrix.chez-sha256 }}
          capabilities: source-runtime,gnu-kernel-dev

      - name: Verify native Chez target
        shell: bash
        run: |
          set -euo pipefail
          "$CHEZ" --version
          probe="$RUNNER_TEMP/machine-type.ss"
          printf '(import (chezscheme))\n(display (machine-type))\n(newline)\n' > "$probe"
          machine="$("$CHEZ" --script "$probe")"
          test "$machine" = "${{ matrix.machine }}"

      - name: Build current Jolt simulation image
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/jolt-core"
          "$CHEZ" --script host/chez/build-jolt.ss sim target/sim/jolt
          test -x target/sim/jolt

      - name: Run simulator and process-isolated gates
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim"
          "$sim" -M:test
          "$sim" -M:outbox-sqlite-test
          "$sim" -M:outbox-http-json-test
          "$sim" -M:runtime-poison-test
          "$sim" -M:ffi-pointer-loan-test
          # Linux x86_64 proves a real zero-argument native call can coexist
          # with modeled SQLite in one hybrid run. Other POSIX hosts execute
          # the same routing and cleanup contract without loading SQLite.
          if [ "${{ matrix.name }}" = "Linux x86_64" ]; then
            "$sim" -M:sqlite-test
          else
            "$sim" -M:sqlite-sim-test
          fi
          # The portable loopback model runs in -M:test on every host; this
          # unchanged jolt.net integration lane is intentionally POSIX-only.
          "$sim" -M:posix-loopback-test
          "$sim" -M:http-hello-test
          "$sim" -M:tcp-bencode-framing-test
          "$sim" -M:future-schedule-poison-test
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$PWD" \
            "$sim" -M:explore-process-test

      - name: Preserve retained process-explorer artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: process-explorer-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/jolt-tmp/jolt-sim-explore-*/
            ${{ runner.temp }}/jolt-tmp/jolt-sim-outbox-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Run retained interactive Maelstrom Broadcast gate
        id: retained_broadcast_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        # Keep the fresh-child lifecycle witness failure-independent from the
        # broad in-process suite and later official Maelstrom/Hegel campaigns.
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          artifacts="$repo/target/retained-broadcast-artifacts"
          mkdir -p "$artifacts"
          cd "$repo"
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
          JOLT_SIM_RETAINED_ARTIFACT_DIR="$artifacts" \
          JOLT_SIM_RETAINED_BROADCAST_PROGRESS_FILE="$artifacts/progress.edn" \
            "$sim" -M:maelstrom-broadcast-retained-test

      - name: Preserve retained interactive Maelstrom Broadcast evidence
        id: retained_broadcast_upload
        if: always() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-broadcast-${{ matrix.toolchain }}
          path: jolt-sim/target/retained-broadcast-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Run Maelstrom Echo JSON-lines process gate
        id: maelstrom_json_lines_gate
        if: always() && !cancelled()
        # Preserve this boundary's complete request/stdout/stderr/status bundle
        # without letting a failure skip the longer application and Hegel gates.
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          export JOLT_SIM_GATE_PARENT="$repo/target/maelstrom-json-lines-gates"
          mkdir -p "$JOLT_SIM_GATE_PARENT"
          cd "$repo"
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$repo" \
            script/run-maelstrom-echo-e2e.sh

      - name: Preserve Maelstrom Echo JSON-lines evidence
        id: maelstrom_json_lines_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maelstrom-json-lines-${{ matrix.toolchain }}
          path: jolt-sim/target/maelstrom-json-lines-gates/
          if-no-files-found: error
          retention-days: 14

      - name: Install verified official Maelstrom release
        id: maelstrom_install
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y graphviz gnuplot
          archive="$RUNNER_TEMP/maelstrom-${MAELSTROM_RELEASE}.tar.bz2"
          curl -fsSL \
            "https://github.com/jepsen-io/maelstrom/releases/download/${MAELSTROM_RELEASE}/maelstrom.tar.bz2" \
            -o "$archive"
          printf '%s  %s\n' "$MAELSTROM_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/maelstrom/maelstrom"
          test -f "$RUNNER_TEMP/maelstrom/lib/maelstrom.jar"
          {
            echo "MAELSTROM_BIN=$RUNNER_TEMP/maelstrom/maelstrom"
            echo "MAELSTROM_JAR=$RUNNER_TEMP/maelstrom/lib/maelstrom.jar"
          } >> "$GITHUB_ENV"

      - name: Run official Maelstrom Echo and Broadcast gates
        id: maelstrom_official_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          export JOLT_SIM_GATE_PARENT="$repo/target/maelstrom-official-gates"
          mkdir -p "$JOLT_SIM_GATE_PARENT"
          cd "$repo"
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$repo" \
            script/run-maelstrom-official-e2e.sh

      - name: Preserve official Maelstrom evidence
        id: maelstrom_official_upload
        if: always() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maelstrom-official-linux-x86_64
          path: jolt-sim/target/maelstrom-official-gates/
          if-no-files-found: error
          retention-days: 14

      - name: Run outbox application gates with crash forensics
        id: outbox_gate
        # Preserve a native crash without allowing it to skip the independent
        # Hegel campaigns and their retained counterexample artifacts.
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
          JOLT_SIM_FORENSIC_TIMEOUT_SECONDS: "300"
        run: |
          set -uo pipefail
          export JOLT_SIM_RUNNER_HOME="$HOME"
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          artifacts="$repo/target/native-crash-${{ matrix.toolchain }}"
          mkdir -p "$artifacts"
          cd "$repo"
          if [ "${{ matrix.name }}" = "Linux x86_64" ]; then
            suffix=test
          else
            suffix=sim-test
          fi
          gate_status=0
          for alias in \
            outbox-delivery-$suffix \
            outbox-json-delivery-$suffix \
            outbox-http-webhook-$suffix; do
            script/run-forensic-gate.sh "$artifacts" "$alias" -- \
              "$sim" "-M:$alias"
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$gate_status" -eq 0 ]; then
              gate_status=$rc
            fi
          done
          exit "$gate_status"

      - name: Preserve native-crash forensic artifacts
        if: always()
        id: forensic_upload
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-crash-${{ matrix.toolchain }}
          # Only explicitly staged, type-checked, size-capped diagnostics are
          # publishable. raw/ is never in an artifact action path.
          path: jolt-sim/target/native-crash-${{ matrix.toolchain }}/upload-safe/
          if-no-files-found: error
          retention-days: 14

      - name: Run real SQLite post-COMMIT crash recovery
        if: matrix.name == 'Linux x86_64'
        timeout-minutes: 10
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim"
          export JOLT_SIM_CRASH_ARTIFACT_DIR="$PWD/target/outbox-crash-artifacts"
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$PWD" \
            "$sim" -M:outbox-crash-recovery-test

      - name: Preserve real SQLite crash-recovery artifacts
        if: always() && matrix.name == 'Linux x86_64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: outbox-crash-recovery-${{ matrix.toolchain }}
          path: jolt-sim/target/outbox-crash-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run optional static-report package gates
        if: matrix.name == 'Linux x86_64'
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim/report"
          generated="$GITHUB_WORKSPACE/jolt-sim/target/report-generated-examples"
          mkdir -p "$generated"
          "$sim" -M:trace-report \
            examples/cooperative-countdown-trace.edn \
            "$generated/cooperative-countdown-trace.html"
          "$sim" -M:case-report \
            examples/outbox-retry-case-outcome.edn \
            "$generated/outbox-retry-case-outcome.html"
          "$sim" -M:test
          JOLT_BIN="$sim" test/downstream-build-smoke.sh

      - name: Preserve static-report smoke artifacts
        if: always() && matrix.name == 'Linux x86_64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: static-report-smoke-${{ matrix.toolchain }}
          path: |
            jolt-sim/target/report-consumer-smoke/
            jolt-sim/target/report-generated-examples/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Node for Ripple browser acceptance
        id: viewer_node
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jolt-sim/viewer/package-lock.json

      - name: Run optional retained-case viewer gates
        id: viewer_gate
        if: matrix.name == 'Linux x86_64'
        # Preserve the failure, but do not let an unrelated viewer defect skip
        # the expensive Hegel campaign and its forensic artifacts below. The
        # terminal step turns this outcome back into a failing job.
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          viewer_artifacts="$repo/target/viewer-replay-artifacts"
          mkdir -p "$viewer_artifacts"
          cd "$GITHUB_WORKSPACE/jolt-sim/viewer"
          "$sim" -M:test
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
          JOLT_SIM_VIEWER_ARTIFACT_DIR="$viewer_artifacts" \
            test/cli-sigint-smoke.sh
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
          JOLT_SIM_VIEWER_ARTIFACT_DIR="$viewer_artifacts" \
          JOLT_SIM_VIEWER_DOCUMENT="$repo/report/examples/outbox-retry-case-outcome.edn" \
            "$sim" -M:e2e-test
          cd "$repo/examples/outbox-workbench"
          JOLT_SIM_OUTBOX_WORKBENCH_PROGRESS_FILE="$viewer_artifacts/outbox-workbench-progress.edn" \
            "$sim" -M:eval-flow-test
          JOLT_SIM_OUTBOX_LIVE_PROGRESS_FILE="$viewer_artifacts/outbox-live-lifecycle-progress.edn" \
            "$sim" -M:live-lifecycle-test
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
          JOLT_SIM_RETAINED_WORKBENCH_PROGRESS_FILE="$viewer_artifacts/retained-workbench-progress.edn" \
            "$sim" -M:retained-workbench-test

      - name: Run Ripple remote Session process acceptance
        id: viewer_remote_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        # Keep the new cross-process attachment witness failure-independent
        # from the established retained-case replay and browser gates.
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          viewer_artifacts="$repo/target/viewer-replay-artifacts"
          mkdir -p "$viewer_artifacts"
          cd "$repo/viewer"
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_VIEWER_ARTIFACT_DIR="$viewer_artifacts" \
            test/remote-session-process-smoke.sh

      - name: Run real Broadcast Ripple HTTP workbench acceptance
        id: broadcast_workbench_http_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64'
        # This gate proves the UI-neutral HTTP and EvalSession services share
        # one real retained worker. Preserve its result while the independent
        # browser acceptance and later application campaigns still run.
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          artifacts="$repo/target/broadcast-workbench-artifacts/http"
          mkdir -p "$artifacts/retained-workers"
          cd "$repo/examples/maelstrom-broadcast-workbench"
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
          JOLT_SIM_RETAINED_ARTIFACT_DIR="$artifacts/retained-workers" \
          JOLT_SIM_BROADCAST_WORKBENCH_PROGRESS_FILE="$artifacts/progress.edn" \
            "$sim" -M:workbench-test

      - name: Install Ripple browser dependencies
        id: viewer_browser_setup
        if: always() && !cancelled() && matrix.name == 'Linux x86_64' && steps.viewer_node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/jolt-sim/viewer"
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Ripple browser acceptance
        id: viewer_browser_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64' && steps.viewer_browser_setup.outcome == 'success'
        # Browser acceptance is failure-independent from the raw HTTP E2E and
        # Hegel campaigns. Its own Playwright output retains screenshots plus
        # trace/video/screenshot diagnostics for a failed or retried attempt.
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim/viewer"
          JOLT_SIM_BIN="$sim" npm run test:browser

      - name: Run real Broadcast Ripple browser acceptance
        id: broadcast_workbench_browser_gate
        if: always() && !cancelled() && matrix.name == 'Linux x86_64' && steps.viewer_browser_setup.outcome == 'success'
        # This is not a second copy of the HTTP scenario: it proves the actual
        # retained controls and persistent evaluator are wired through Ripple's
        # browser DOM without request routing or transport mocks.
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          cd "$repo/viewer"
          JOLT_SIM_BIN="$sim" \
          JOLT_SIM_PROJECT_DIR="$repo" \
            ./node_modules/.bin/playwright test \
              --config=playwright.broadcast-retained.config.mjs

      - name: Preserve real Broadcast Ripple workbench evidence
        id: broadcast_workbench_upload
        if: always() && matrix.name == 'Linux x86_64'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: broadcast-ripple-workbench-${{ matrix.toolchain }}
          path: |
            jolt-sim/target/broadcast-workbench-artifacts/
            jolt-sim/target/ripple-playwright/broadcast-retained/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve retained-case viewer replay artifacts
        if: always() && matrix.name == 'Linux x86_64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: viewer-replay-${{ matrix.toolchain }}
          path: |
            jolt-sim/target/viewer-replay-artifacts/
            jolt-sim/target/ripple-playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Hegel schedule exploration
        if: matrix.hegel
        # A hung worker must not consume the job-level deadline before the two
        # always() forensic-retention steps can start. The terminal-boundary
        # campaign adds 18 fresh worker cases to a gate whose prior hosted
        # runtime was about 22 minutes, so retain bounded headroom beneath the
        # expanded Linux/Hegel job ceiling and ahead of the independent
        # webhook campaign.
        timeout-minutes: 35
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim"
          export JOLT_SIM_CASE_ARTIFACT_DIR="$PWD/target/outbox-case-artifacts"
          export JOLT_SIM_CASE_TEMP_DIR="$PWD/target/outbox-case-runs"
          export JOLT_SIM_GATE_PARENT="$PWD/target/hegel-gates"
          mkdir -p \
            "$JOLT_SIM_CASE_ARTIFACT_DIR" \
            "$JOLT_SIM_CASE_TEMP_DIR" \
            "$JOLT_SIM_GATE_PARENT"
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$PWD" \
            script/run-hegel-gates.sh

      - name: Explore JSON webhook acknowledgement boundaries
        if: always() && !cancelled() && matrix.hegel
        # Keep this fresh-worker application campaign failure-independent from
        # the already long general Hegel campaign. Both invocations retain
        # their own mktemp gate roots beneath the shared artifact parent.
        timeout-minutes: 25
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          mkdir -p "$HOME" "$JOLT_CACHE_DIR" "$TMPDIR"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          cd "$GITHUB_WORKSPACE/jolt-sim"
          export JOLT_SIM_CASE_ARTIFACT_DIR="$PWD/target/outbox-case-artifacts"
          export JOLT_SIM_CASE_TEMP_DIR="$PWD/target/outbox-case-runs"
          export JOLT_SIM_GATE_PARENT="$PWD/target/hegel-gates"
          mkdir -p \
            "$JOLT_SIM_CASE_ARTIFACT_DIR" \
            "$JOLT_SIM_CASE_TEMP_DIR" \
            "$JOLT_SIM_GATE_PARENT"
          JOLT_SIM_BIN="$sim" JOLT_SIM_PROJECT_DIR="$PWD" \
            script/run-hegel-gates.sh outbox-http-webhook-hegel-test

      - name: Render retained whole-application case reports
        if: always() && !cancelled() && matrix.hegel
        timeout-minutes: 10
        shell: bash
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -uo pipefail
          export HOME="$RUNNER_TEMP/jolt-home"
          export JOLT_CACHE_DIR="$RUNNER_TEMP/jolt-cache"
          export TMPDIR="$RUNNER_TEMP/jolt-tmp"
          sim="$GITHUB_WORKSPACE/jolt-core/target/sim/jolt"
          repo="$GITHUB_WORKSPACE/jolt-sim"
          render_failures=0
          while IFS= read -r -d '' document; do
            output="${document%/*}/report.html"
            if ! (cd "$repo/report" &&
                  timeout --signal=TERM --kill-after=10s 120s \
                    "$sim" -M:case-report "$document" "$output"); then
              echo "failed to render retained Case/Outcome: $document" >&2
              render_failures=$((render_failures + 1))
            fi
          done < <(find "$repo/target/outbox-case-artifacts" \
                         "$repo/target/outbox-case-runs" \
                         -type f -name case-outcome.edn -print0 2>/dev/null)
          test "$render_failures" -eq 0

      - name: Preserve whole-application case artifacts
        if: always() && matrix.hegel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: whole-app-case-outcomes-${{ matrix.toolchain }}
          path: |
            jolt-sim/target/outbox-case-artifacts/
            jolt-sim/target/outbox-case-runs/
            jolt-sim/target/hegel-gates/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce deferred application results
        if: always() && !cancelled()
        shell: bash
        run: |
          failed=0
          if [[ "${{ steps.maelstrom_json_lines_gate.outcome }}" != "success" ]]; then
            echo "Maelstrom JSON-lines process gate outcome: ${{ steps.maelstrom_json_lines_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ steps.maelstrom_json_lines_upload.outcome }}" != "success" ]]; then
            echo "Maelstrom JSON-lines artifact upload outcome: ${{ steps.maelstrom_json_lines_upload.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.maelstrom_install.outcome }}" != "success" ]]; then
            echo "official Maelstrom install outcome: ${{ steps.maelstrom_install.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.maelstrom_official_gate.outcome }}" != "success" ]]; then
            echo "official Maelstrom gate outcome: ${{ steps.maelstrom_official_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.maelstrom_official_upload.outcome }}" != "success" ]]; then
            echo "official Maelstrom artifact upload outcome: ${{ steps.maelstrom_official_upload.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ steps.outbox_gate.outcome }}" != "success" ]]; then
            echo "outbox application gate outcome: ${{ steps.outbox_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ steps.forensic_upload.outcome }}" != "success" ]]; then
            echo "native-crash artifact upload outcome: ${{ steps.forensic_upload.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.retained_broadcast_gate.outcome }}" != "success" ]]; then
            echo "retained Broadcast gate outcome: ${{ steps.retained_broadcast_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.retained_broadcast_upload.outcome }}" != "success" ]]; then
            echo "retained Broadcast artifact upload outcome: ${{ steps.retained_broadcast_upload.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.viewer_node.outcome }}" != "success" ]]; then
            echo "Ripple Node setup outcome: ${{ steps.viewer_node.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.broadcast_workbench_http_gate.outcome }}" != "success" ]]; then
            echo "Broadcast Ripple HTTP workbench outcome: ${{ steps.broadcast_workbench_http_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.viewer_browser_setup.outcome }}" != "success" ]]; then
            echo "Ripple browser dependency setup outcome: ${{ steps.viewer_browser_setup.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.viewer_gate.outcome }}" != "success" ]]; then
            echo "retained-case viewer gate outcome: ${{ steps.viewer_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.viewer_remote_gate.outcome }}" != "success" ]]; then
            echo "Ripple remote Session gate outcome: ${{ steps.viewer_remote_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.viewer_browser_gate.outcome }}" != "success" ]]; then
            echo "Ripple browser gate outcome: ${{ steps.viewer_browser_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.broadcast_workbench_browser_gate.outcome }}" != "success" ]]; then
            echo "Broadcast Ripple real browser outcome: ${{ steps.broadcast_workbench_browser_gate.outcome }}" >&2
            failed=1
          fi
          if [[ "${{ matrix.name }}" = "Linux x86_64" && \
                "${{ steps.broadcast_workbench_upload.outcome }}" != "success" ]]; then
            echo "Broadcast Ripple artifact upload outcome: ${{ steps.broadcast_workbench_upload.outcome }}" >&2
            failed=1
          fi
          exit "$failed"

  sim-windows-x86-64:
    name: sim image (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout jolt-sim
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: jolt-sim

      - name: Checkout pinned Jolt simulation core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt-core

      - name: Install MinGW build dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            git make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib

      - name: Install verified Chez 10.4.1 toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime,gnu-kernel-dev

      - name: Verify native Chez target
        shell: pwsh
        run: |
          & $env:CHEZ --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -LiteralPath $probe -Value @(
            '(import (chezscheme))'
            '(display (machine-type))'
            '(newline)'
          )
          $machine = (& $env:CHEZ --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($machine -ne 'ta6nt') { throw "expected ta6nt, got '$machine'" }

      - name: Build current Jolt simulation image
        shell: msys2 {0}
        env:
          JOLT_AOT_CACHE: "0"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/jolt-core"
          "$JOLT_CHEZ" --script host/chez/build-jolt.ss sim target/sim/jolt
          test -x target/sim/jolt.exe

      - name: Run simulator and process-isolated gates
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP 'jolt-home'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'jolt-cache'
          $tempDir = Join-Path $env:RUNNER_TEMP 'jolt-tmp'
          New-Item -ItemType Directory -Force $homeDir, $cacheDir, $tempDir | Out-Null
          $env:HOME = $homeDir
          $env:JOLT_CACHE_DIR = $cacheDir
          $env:TMPDIR = $tempDir
          $env:JOLT_AOT_CACHE = '0'
          $shell = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $shell) { throw 'no sh.exe found for Jolt dependency tooling' }
          $env:JOLT_SH = $shell
          $sim = Join-Path $env:GITHUB_WORKSPACE 'jolt-core\target\sim\jolt.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'jolt-sim'
          $env:JOLT_SIM_BIN = $sim
          $env:JOLT_SIM_PROJECT_DIR = $project
          Push-Location $project
          try {
            # Current Jolt ProcessBuilder supervision uses the POSIX
            # /bin/sh + waitpid/kill host surface. Keep its fresh-process gate
            # in the POSIX matrix until Jolt exposes an equivalent Windows host.
            foreach ($alias in @(
              '-M:test',
              '-M:runtime-poison-test',
              '-M:ffi-pointer-loan-test',
              '-M:future-schedule-poison-test')) {
              & $sim $alias
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          finally { Pop-Location }

  source-windows-arm64:
    name: source suite (Windows aarch64)
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout jolt-sim
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: jolt-sim

      - name: Checkout pinned Jolt core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt-core

      - name: Install verified Chez 10.4.1 toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Run current source suite natively
        shell: pwsh
        run: |
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected ARM64 runner, got '${{ runner.arch }}'"
          }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -LiteralPath $probe -Value @(
            '(import (chezscheme))'
            '(display (machine-type))'
            '(newline)'
          )
          $machine = (& $env:CHEZ --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($machine -ne 'tarm64nt') { throw "expected tarm64nt, got '$machine'" }
          $homeDir = Join-Path $env:RUNNER_TEMP 'jolt-home'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'jolt-cache'
          $tempDir = Join-Path $env:RUNNER_TEMP 'jolt-tmp'
          New-Item -ItemType Directory -Force $homeDir, $cacheDir, $tempDir | Out-Null
          $env:HOME = $homeDir
          $env:JOLT_CACHE_DIR = $cacheDir
          $env:TMPDIR = $tempDir
          $env:JOLT_AOT_CACHE = '0'
          $shell = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $shell) { throw 'no sh.exe found for Jolt dependency tooling' }
          $env:JOLT_SH = $shell
          $project = Join-Path $env:GITHUB_WORKSPACE 'jolt-sim'
          $core = Join-Path $env:GITHUB_WORKSPACE 'jolt-core'
          $env:JOLT_PWD = $project
          Push-Location $core
          try {
            & $env:CHEZ --script host\chez\cli.ss '-M:test'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
